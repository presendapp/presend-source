<!DOCTYPE html>
<html lang="{{LANG}}">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{TITLE}} — Presend Blog</title>
  <meta name="description" content="{{META_DESC}}">
  <meta name="keywords" content="{{KEYWORDS}}">
  <meta property="og:title" content="{{TITLE}}">
  <meta property="og:description" content="{{META_DESC}}">
  <meta property="og:type" content="article">
  <meta property="og:url" content="{{URL}}">
  <meta property="og:image" content="https://presend.pages.dev/og-image.png">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="canonical" href="{{URL}}">
  <link rel="stylesheet" href="/style.min.css">
  <style>
    .blog-container{max-width:800px;margin:0 auto;padding:2rem 1rem}
    .blog-header{border-bottom:2px solid var(--accent);padding-bottom:1rem;margin-bottom:2rem}
    .blog-header h1{font-size:2rem;margin-bottom:.5rem}
    .blog-meta{color:var(--muted);font-size:.9rem;margin-bottom:1rem}
    .blog-content{line-height:1.8;font-size:1.05rem}
    .blog-content h2{font-size:1.4rem;margin-top:2rem;margin-bottom:1rem;color:var(--accent)}
    .blog-content h3{font-size:1.15rem;margin-top:1.5rem;margin-bottom:.5rem}
    .blog-content p{margin-bottom:1rem}
    .blog-content ul, .blog-content ol{margin-bottom:1rem;padding-left:1.5rem}
    .blog-content li{margin-bottom:.3rem}
    .blog-content a{color:var(--accent);text-decoration:underline}
    .blog-content strong{color:var(--text)}
    .blog-cta{background:var(--card-bg);border:1px solid var(--border);border-radius:12px;padding:1.5rem;margin:2rem 0;text-align:center}
    .blog-cta h3{margin-bottom:.5rem}
    .blog-cta .btn{display:inline-block;margin-top:.5rem}
    .blog-nav{display:flex;gap:1rem;justify-content:space-between;margin-top:3rem;padding-top:1rem;border-top:1px solid var(--border)}
    .blog-nav a{color:var(--accent)}
    .blog-tags{display:flex;gap:.5rem;flex-wrap:wrap;margin-top:1rem}
    .blog-tags span{background:var(--card-bg);border:1px solid var(--border);padding:.2rem .6rem;border-radius:20px;font-size:.8rem}
    .breadcrumb{font-size:.85rem;color:var(--muted);margin-bottom:1rem}
    .breadcrumb a{color:var(--muted)}
  </style>
</head>
<body>
  <header>
    <div class="container nav">
      <a href="/" class="logo">Presend</a>
      <nav>
        <a href="/blog/">Blog</a>
        <a href="/tools/exif-remover">Tools</a>
        <a href="/about">About</a>
      </nav>
    </div>
  </header>

  <main class="blog-container">
    <div class="breadcrumb">
      <a href="/">Home</a> → <a href="/blog/">Blog</a> → {{CATEGORY}}
    </div>
    
    <article>
      <div class="blog-header">
        <h1>{{TITLE}}</h1>
        <div class="blog-meta">
          📅 {{DATE}} · ⏱️ {{READ_TIME}} min read · 🏷️ {{CATEGORY}}
        </div>
        <div class="blog-tags">
          {{TAGS}}
        </div>
      </div>
      
      <div class="blog-content">
        {{CONTENT}}
      </div>
      
      <div class="blog-cta">
        <h3>🛠️ Try it now — free & private</h3>
        <p>{{CTA_TEXT}}</p>
        <a href="{{TOOL_URL}}" class="btn btn-primary">{{CTA_BUTTON}}</a>
      </div>
    </article>
    
    <div class="blog-nav">
      <a href="{{PREV_URL}}">← {{PREV_TITLE}}</a>
      <a href="{{NEXT_URL}}">{{NEXT_TITLE}} →</a>
    </div>
  </main>

  <footer>
    <div class="container">
      <p>© 2026 Presend · <a href="/privacy">Privacy</a> · <a href="/blog/">Blog</a></p>
    </div>
  </footer>
</body>
</html>
