<body>
<div class="admin-container">
<h1>📊 Presend Stats</h1>
<p class="loading" id="status">Загрузка статистики...</p>
<div class="stat-card">
<div class="stat-number" id="total">—</div>
<div>Просмотры страниц (оценка)</div>
</div>
<div class="stat-card">
<h2>По инструменту</h2>
<div id="tools-list">Загрузка...</div>
</div>
<p style="margin-top: 2rem; color: #6c757d; font-size: 0.9rem;">🔒 Статистика содержит только счётчики: без файлов cookie и IP-адресов.</p>
</div>
<script>
    // Les noms viennent de l'API : échappés avant insertion dans le HTML.
    const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    async function loadStats() {
      try {
        const res = await fetch('/api/stats');
        const data = await res.json();
        
        document.getElementById('status').textContent = 'Last updated: ' + new Date().toLocaleString();
        document.getElementById('total').textContent = data.total.toLocaleString();
        
        const toolsDiv = document.getElementById('tools-list');
        if (!data.tools || Object.keys(data.tools).length === 0) {
          toolsDiv.innerHTML = '<p>No data yet.</p>';
          return;
        }
        
        let html = '';
        for (const [tool, dates] of Object.entries(data.tools)) {
          const toolTotal = Object.values(dates).reduce((a, b) => a + b, 0);
          html += `<div class="tool-row"><strong>${esc(tool)}</strong> <span>${toolTotal.toLocaleString()}</span></div>`;
          for (const [date, count] of Object.entries(dates)) {
            html += `<div class="tool-row" style="padding-left: 1rem; font-size: 0.9rem; color: #6c757d;">
              ${esc(date)} — ${count.toLocaleString()}
            </div>`;
          }
        }
        toolsDiv.innerHTML = html;
      } catch (e) {
        document.getElementById('status').textContent = 'Error loading stats';
        document.getElementById('status').className = 'error';
      }
    }
    
    loadStats();
    setInterval(loadStats, 30000);
  </script>
